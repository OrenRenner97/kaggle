# Базовый стек — лёгкий. Тяжёлое (Airflow, Redpanda, Grafana) включается профилями
# только на этапах, где нужно: docker compose --profile stream up -d
name: kaggle-plus

services:
  # «Продовая» OLTP-база компании из сценария: сюда кладём имитацию сырых таблиц
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: oltp
    ports: ["5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    mem_limit: 1g

  # Стриминг событий (антифрод и т.п.) — только по профилю
  redpanda:
    profiles: [stream]
    image: redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --overprovisioned, --smp, "1", --memory, 1G, --mode, dev-container]
    ports: ["19092:9092"]
    mem_limit: 1500m

volumes:
  pg_data:
