[project]
name = "kaggle-plus"
version = "0.1.0"
description = "Соревнования Kaggle как имитация реальных ML-проектов: от сырых источников до деплоя и мониторинга"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "duckdb",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "lightgbm",
    "catboost",
    "xgboost",
    "matplotlib",
    "seaborn",
    "mlflow",
    "pandera",
    "shap",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn[standard]"]
db = ["psycopg[binary]", "sqlalchemy"]
onnx = ["onnx", "onnxruntime", "skl2onnx"]

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "ipykernel", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "competitions"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
