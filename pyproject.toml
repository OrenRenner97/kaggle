[project]
name = "kaggle-plus"
version = "0.1.0"
description = "Kaggle: глубокие ноутбуки-разборы + прод-решения в виде переносимых артефактов (ONNX, native)"
requires-python = ">=3.12,<3.14"
# Ядро прод-инференса: только то, что нужно, чтобы загрузить артефакт и сделать предсказание
dependencies = [
    "numpy",
    "polars",
    "pyarrow",
    "onnxruntime",
]

[project.optional-dependencies]
# Обучение и экспорт артефактов
train = [
    "pandas",
    "scikit-learn",
    "lightgbm",
    "catboost",
    "xgboost",
    "onnx",
    "skl2onnx",
    "onnxmltools",
]
# Исследование в ноутбуках
research = [
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "shap",
    "duckdb",
]

[project.scripts]
kagglib = "kagglib.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "jupyterlab", "ipykernel", "jupytext", "nbconvert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kagglib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
